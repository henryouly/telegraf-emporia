# Telegraf polls Emporia via emporia-poll and writes to InfluxDB v2.
# Deploy on the InfluxDB host; see docs/telegraf.md.
# Secrets come from the environment, never this file:
#   INFLUX_TOKEN  - InfluxDB v2 token with write access to the energy bucket
#   INFLUX_ORG    - InfluxDB organization (name or ID)
#   EMPORIA_*     - read by emporia-poll (EMPORIA_EMAIL, EMPORIA_PASSWORD,
#                   COGNITO_REGION, COGNITO_CLIENT_ID, FETCH_WINDOW,
#                   EMPORIA_TOKEN_FILE for the Cognito token cache)

[agent]
  interval = "1m"
  round_interval = true
  flush_interval = "30s"
  omit_hostname = true

[[inputs.exec]]
  commands = ["/usr/local/bin/emporia-poll"]
  timeout = "50s"
  data_format = "influx"

[[outputs.influxdb_v2]]
  # localhost when Telegraf runs next to InfluxDB; otherwise the LAN URL.
  urls = ["http://localhost:8086"]
  token = "$INFLUX_TOKEN"
  organization = "$INFLUX_ORG"
  bucket = "energy"
